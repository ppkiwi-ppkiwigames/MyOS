<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>MyOS</title>
    <style>
        :root {
            --win: #ffffff;
            --bar: #f1f3f4;
            --text: #202124;
            --sub: #5f6368;
            --line: #dadce0;
            --shelf: rgba(248,249,250,.78);
            --panel: #f8f9fa;
            --hover: rgba(60,64,67,.1);
            --accent: #1a73e8;
            --accent-bg: #e8f0fe;
            --chip: #e8eaed;
        }

        [data-theme="dark"] {
            --win: #202124;
            --bar: #2d2e31;
            --text: #e8eaed;
            --sub: #9aa0a6;
            --line: #3c4043;
            --shelf: rgba(32,33,36,.8);
            --panel: #2d2e31;
            --hover: rgba(232,234,237,.1);
            --accent: #8ab4f8;
            --accent-bg: #394457;
            --chip: #3c4043;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        \n body, body button, body a, body .fr, body .lapp, body .sb {
            cursor: var(--os-cursor,auto)
        }

        \n input, textarea, [contenteditable="true"] {
            cursor: text
        }

        html, body {
            height: 100%;
            overflow: hidden
        }

        body {
            font-family: "Google Sans","Roboto","Segoe UI",system-ui,-apple-system,sans-serif;
            font-size: 14px;
            color: var(--text);
            background: #111;
            user-select: none;
            -webkit-user-select: none
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer
        }

        input, textarea {
            font: inherit;
            color: inherit
        }

        svg {
            display: block
        }

        #wall {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center
        }

        #wins {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 56px
        }

        #dim {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 99999
        }

        /* windows */
        .win {
            position: absolute;
            background: var(--win);
            color: var(--text);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 340px;
            min-height: 240px;
            box-shadow: 0 0 0 1px rgba(0,0,0,.14),0 10px 34px rgba(0,0,0,.3);
            animation: pop .13s ease-out
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.97)
            }
        }

        .win.max {
            border-radius: 0;
            left: 0 !important;
            top: 0 !important;
            width: 100% !important;
            height: 100% !important
        }

        .tb {
            height: 40px;
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 6px 0 12px;
            background: var(--bar);
            touch-action: none;
            font-size: 13px
        }

        .win.inactive .tb {
            opacity: .78
        }

        .tb .tic {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            display: grid;
            place-items: center;
            flex: none
        }

            .tb .tic svg {
                width: 12px;
                height: 12px
            }

        .tb .t {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .wb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: var(--sub)
        }

            .wb svg {
                width: 14px;
                height: 14px
            }

            .wb:hover {
                background: var(--hover);
                color: var(--text)
            }

            .wb.x:hover {
                background: #d93025;
                color: #fff
            }

        .wc {
            flex: 1;
            min-height: 0;
            overflow: auto;
            position: relative;
            user-select: text;
            -webkit-user-select: text
        }

        .rz {
            position: absolute;
            z-index: 5
        }

            .rz.r {
                right: -3px;
                top: 8px;
                bottom: 8px;
                width: 7px;
                cursor: ew-resize
            }

            .rz.l {
                left: -3px;
                top: 8px;
                bottom: 8px;
                width: 7px;
                cursor: ew-resize
            }

            .rz.b {
                bottom: -3px;
                left: 8px;
                right: 8px;
                height: 7px;
                cursor: ns-resize
            }

            .rz.t {
                top: -3px;
                left: 8px;
                right: 8px;
                height: 7px;
                cursor: ns-resize
            }

            .rz.br {
                right: -3px;
                bottom: -3px;
                width: 14px;
                height: 14px;
                cursor: nwse-resize
            }

            .rz.bl {
                left: -3px;
                bottom: -3px;
                width: 14px;
                height: 14px;
                cursor: nesw-resize
            }

            .rz.tr {
                right: -3px;
                top: -3px;
                width: 14px;
                height: 14px;
                cursor: nesw-resize
            }

            .rz.tl {
                left: -3px;
                top: -3px;
                width: 14px;
                height: 14px;
                cursor: nwse-resize
            }

        .win.max .rz {
            display: none
        }

        /* shelf */
        #shelf {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 56px;
            z-index: 9000;
            background: var(--shelf);
            backdrop-filter: blur(20px) saturate(1.5);
            -webkit-backdrop-filter: blur(20px) saturate(1.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border-top: 1px solid rgba(255,255,255,.18)
        }

        .sb {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            transition: background .12s
        }

            .sb:hover {
                background: var(--hover)
            }

            .sb .run {
                position: absolute;
                bottom: 2px;
                left: 50%;
                width: 5px;
                height: 5px;
                margin-left: -2.5px;
                border-radius: 50%;
                background: var(--sub);
                display: none
            }

            .sb.on .run {
                display: block
            }

            .sb.act .run {
                background: var(--accent);
                width: 14px;
                margin-left: -7px;
                border-radius: 3px
            }

        .ic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex: none
        }

            .ic svg {
                width: 18px;
                height: 18px;
                fill: none;
                stroke: #fff;
                stroke-width: 1.8;
                stroke-linecap: round;
                stroke-linejoin: round
            }

        .ring {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2.5px solid var(--text);
            opacity: .85
        }

        #tray {
            position: absolute;
            right: 8px;
            top: 7px;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            border-radius: 21px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500
        }

            #tray:hover {
                background: var(--hover)
            }

            #tray svg {
                width: 17px;
                height: 17px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.8;
                stroke-linecap: round;
                stroke-linejoin: round
            }

        /* launcher */
        #launcher {
            position: fixed;
            left: 12px;
            bottom: 64px;
            width: 580px;
            height: 470px;
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 80px);
            z-index: 9500;
            background: var(--panel);
            border-radius: 26px;
            box-shadow: 0 0 0 1px rgba(0,0,0,.1),0 18px 50px rgba(0,0,0,.35);
            display: none;
            flex-direction: column;
            padding: 18px 22px;
            animation: pop .14s ease-out
        }

            #launcher.open {
                display: flex
            }

        .lsearch {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--chip);
            border-radius: 24px;
            height: 44px;
            padding: 0 16px;
            margin-bottom: 18px
        }

            .lsearch svg {
                width: 18px;
                height: 18px;
                fill: none;
                stroke: var(--sub);
                stroke-width: 2;
                stroke-linecap: round
            }

            .lsearch input {
                flex: 1;
                background: none;
                border: 0;
                outline: 0;
                user-select: text
            }

        .lgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(96px,1fr));
            gap: 8px;
            overflow: auto
        }

        .lapp {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 4px;
            border-radius: 14px;
            font-size: 12.5px;
            text-align: center
        }

            .lapp:hover {
                background: var(--hover)
            }

            .lapp .ic {
                width: 52px;
                height: 52px
            }

                .lapp .ic svg {
                    width: 26px;
                    height: 26px
                }

        /* quick settings */
        #qs {
            position: fixed;
            right: 10px;
            bottom: 64px;
            width: 360px;
            max-width: calc(100vw - 20px);
            z-index: 9500;
            background: var(--panel);
            border-radius: 26px;
            padding: 16px;
            box-shadow: 0 0 0 1px rgba(0,0,0,.1),0 18px 50px rgba(0,0,0,.35);
            display: none;
            animation: pop .14s ease-out
        }

            #qs.open {
                display: block
            }

        .qhead {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 2px 6px 12px
        }

            .qhead b {
                font-size: 22px;
                font-weight: 500
            }

            .qhead span {
                color: var(--sub);
                font-size: 13px
            }

        .qtiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px
        }

        .qt {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 56px;
            padding: 0 14px;
            border-radius: 28px;
            background: var(--chip);
            text-align: left
        }

            .qt.on {
                background: var(--accent);
                color: #fff
            }

        [data-theme="dark"] .qt.on {
            color: #202124
        }

        .qt svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none
        }

        .qt small {
            display: block;
            font-size: 11.5px;
            opacity: .8
        }

        .qs-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 8px
        }

            .qs-row svg {
                width: 20px;
                height: 20px;
                fill: none;
                stroke: var(--sub);
                stroke-width: 1.9;
                stroke-linecap: round;
                stroke-linejoin: round
            }

        input[type=range] {
            flex: 1;
            accent-color: var(--accent)
        }

        .qfoot {
            display: flex;
            justify-content: space-between;
            color: var(--sub);
            font-size: 12.5px;
            padding: 12px 8px 0
        }

        /* boot */
        #boot {
            position: fixed;
            inset: 0;
            background: #0b0c0f;
            z-index: 200000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 26px;
            color: #e8eaed;
            transition: opacity .5s
        }

            #boot.gone {
                opacity: 0;
                pointer-events: none
            }

            #boot h1 {
                font-weight: 400;
                font-size: 30px;
                letter-spacing: .04em
            }

        .spin {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid #3c4043;
            border-top-color: #8ab4f8;
            animation: sp .8s linear infinite
        }

        @keyframes sp {
            to {
                transform: rotate(360deg)
            }
        }

        /* in-app dialog */
        .dlg-b {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.32);
            display: grid;
            place-items: center;
            z-index: 20
        }

        .dlg {
            background: var(--win);
            border-radius: 16px;
            padding: 20px;
            width: min(340px,90%);
            box-shadow: 0 10px 30px rgba(0,0,0,.35)
        }

            .dlg h4 {
                font-weight: 500;
                font-size: 16px;
                margin-bottom: 12px
            }

            .dlg input {
                width: 100%;
                padding: 9px 12px;
                border-radius: 8px;
                border: 1px solid var(--line);
                background: var(--win);
                outline: 0;
                margin-bottom: 16px
            }

                .dlg input:focus {
                    border-color: var(--accent)
                }

            .dlg .row {
                display: flex;
                justify-content: flex-end;
                gap: 8px
            }

        .btn {
            padding: 8px 16px;
            border-radius: 18px;
            font-weight: 500;
            color: var(--accent)
        }

            .btn:hover {
                background: var(--accent-bg)
            }

            .btn.fill {
                background: var(--accent);
                color: #fff
            }

        [data-theme="dark"] .btn.fill {
            color: #202124
        }

        .btn.fill:hover {
            filter: brightness(.95);
            background: var(--accent)
        }

        /* Newspedia */
        .np {
            display: flex;
            flex-direction: column;
            height: 100%
        }

        .np-top {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
            flex: none
        }

        .np-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            flex: 1;
            scrollbar-width: none
        }

            .np-tabs::-webkit-scrollbar {
                display: none
            }

        .chip {
            padding: 6px 13px;
            border-radius: 16px;
            background: var(--chip);
            white-space: nowrap;
            font-size: 13px
        }

            .chip.on {
                background: var(--accent-bg);
                color: var(--accent);
                font-weight: 500
            }

        .np-q {
            width: 170px;
            padding: 7px 12px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: var(--win);
            outline: 0
        }

            .np-q:focus {
                border-color: var(--accent)
            }

        .np-r {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex: none
        }

            .np-r:hover {
                background: var(--hover)
            }

            .np-r svg {
                width: 17px;
                height: 17px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round
            }

            .np-r.busy svg {
                animation: sp 1s linear infinite
            }

        .np-st {
            padding: 8px 16px 0;
            color: var(--sub);
            font-size: 12px;
            flex: none
        }

        .np-list {
            flex: 1;
            overflow: auto;
            padding: 12px 14px 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(240px,1fr));
            gap: 12px;
            align-content: start
        }

        .nc {
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            background: var(--win)
        }

            .nc:hover {
                background: var(--bar)
            }

            .nc .im {
                aspect-ratio: 16/9;
                background: var(--chip);
                overflow: hidden
            }

                .nc .im img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    display: block
                }

            .nc .bd {
                padding: 10px 12px 12px
            }

            .nc .mt {
                font-size: 11.5px;
                color: var(--sub);
                margin-bottom: 4px
            }

            .nc h4 {
                font-weight: 500;
                font-size: 14px;
                line-height: 1.35
            }

            .nc p {
                font-size: 12.5px;
                color: var(--sub);
                margin-top: 5px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden
            }

        .np-empty {
            grid-column: 1/-1;
            text-align: center;
            color: var(--sub);
            padding: 50px 0
        }

        /* Files */
        .fm {
            display: flex;
            flex-direction: column;
            height: 100%
        }

        .fm-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            flex: none
        }

        .fm-path {
            flex: 1;
            padding: 6px 12px;
            border-radius: 16px;
            background: var(--chip);
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .fm-list {
            flex: 1;
            overflow: auto
        }

        .fr {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            border-bottom: 1px solid var(--line);
            cursor: default
        }

            .fr:hover {
                background: var(--hover)
            }

            .fr.sel {
                background: var(--accent-bg)
            }

            .fr svg {
                width: 20px;
                height: 20px;
                fill: none;
                stroke: var(--sub);
                stroke-width: 1.7;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: none
            }

            .fr.d svg {
                stroke: var(--accent)
            }

            .fr .n {
                flex: 1
            }

            .fr .s {
                color: var(--sub);
                font-size: 12.5px;
                width: 80px;
                text-align: right
            }

        .sbtn {
            height: 32px;
            padding: 0 12px;
            border-radius: 16px;
            font-size: 13px;
            color: var(--text)
        }

            .sbtn:hover {
                background: var(--hover)
            }

            .sbtn:disabled {
                opacity: .4;
                pointer-events: none
            }

        /* Text */
        .tx {
            display: flex;
            flex-direction: column;
            height: 100%
        }

            .tx textarea {
                flex: 1;
                border: 0;
                outline: 0;
                resize: none;
                padding: 14px 16px;
                background: var(--win);
                font-family: "Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
                font-size: 13.5px;
                line-height: 1.55;
                tab-size: 2
            }

        /* Terminal */
        .tm {
            background: #1a1b1e;
            color: #e6e6e6;
            height: 100%;
            padding: 10px 12px;
            overflow: auto;
            font-family: "Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
            font-size: 13px;
            line-height: 1.5;
            cursor: text
        }

            .tm .ln {
                white-space: pre-wrap;
                word-break: break-word
            }

            .tm .pr {
                color: #8ab4f8
            }

            .tm .in {
                display: flex;
                gap: 8px
            }

            .tm input {
                flex: 1;
                background: none;
                border: 0;
                outline: 0;
                color: inherit;
                font: inherit
            }

        /* Settings */
        .st {
            display: flex;
            height: 100%
        }

        .st-nav {
            width: 190px;
            border-right: 1px solid var(--line);
            padding: 10px 8px;
            flex: none
        }

            .st-nav button {
                display: block;
                width: 100%;
                text-align: left;
                padding: 10px 14px;
                border-radius: 20px;
                margin-bottom: 2px
            }

                .st-nav button:hover {
                    background: var(--hover)
                }

                .st-nav button.on {
                    background: var(--accent-bg);
                    color: var(--accent);
                    font-weight: 500
                }

        .st-main {
            flex: 1;
            padding: 20px 26px;
            overflow: auto
        }

            .st-main h3 {
                font-weight: 500;
                font-size: 18px;
                margin-bottom: 16px
            }

            .st-main h5 {
                font-weight: 500;
                font-size: 13px;
                color: var(--sub);
                margin: 20px 0 10px
            }

        .seg {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden
        }

            .seg button {
                padding: 8px 20px
            }

                .seg button.on {
                    background: var(--accent-bg);
                    color: var(--accent);
                    font-weight: 500
                }

        .walls {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(130px,1fr));
            gap: 10px
        }

            .walls button {
                aspect-ratio: 16/10;
                border-radius: 10px;
                background-size: cover;
                background-position: center;
                border: 2px solid transparent;
                outline: 1px solid var(--line)
            }

                .walls button.on {
                    border-color: var(--accent)
                }

        .kv {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 8px 12px;
            font-size: 13.5px
        }

            .kv span:nth-child(odd) {
                color: var(--sub)
            }


        /* Update log + app store */
        .store {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden
        }

        .store-head {
            padding: 18px 20px 12px;
            border-bottom: 1px solid var(--line);
            flex: none
        }

            .store-head h2 {
                font-size: 22px;
                font-weight: 500;
                margin-bottom: 5px
            }

            .store-head p {
                color: var(--sub);
                font-size: 13px
            }

        .store-list {
            padding: 14px 18px;
            overflow: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(230px,1fr));
            gap: 12px;
            align-content: start

            }

                width: 100%;
                padding: 9px 11px;
                border: 1px solid var(--line);
                border-radius: 8px;

            transition: background-color .3s,opacity .2s

        }

            }
        }

        }

            }

            35% {

            }

                transform: none
            }

                transform: translateY(-4px)
            }

            }

            }

                }

                }

            .web iframe {

            }

        }

            }

            }

                        var d = FS[p].t === "d";
                        return '<div class="fr' + (d ? " d" : "") + '" style="--i:' + Math.min(i, 12) + '" data-p="' + esc(p) + '">' + (d ? FOLDER : FILE) + '<span class="n">' + esc(base(p)) + '</span><span class="s">' + (d ? "Folder" : bytes((FS[p].c || "").length)) + '</span></div>';
                    }).join("") : '<div style="padding:40px;text-align:center;color:var(--sub)">This folder is empty</div>';
                }
                lst.addEventListener("click", function (e) {
                    var r = e.target.closest(".fr"); if (!r) return;
                    lst.querySelectorAll(".sel").forEach(function (x) { x.classList.remove("sel") });
                    r.classList.add("sel"); sel = r.getAttribute("data-p"); del.disabled = false; edit.disabled = !(FS[sel] && FS[sel].t === "f");
                });
                lst.addEventListener("dblclick", function (e) {
                    var r = e.target.closest(".fr"); if (!r) return;
                    var p = r.getAttribute("data-p");
                    if (FS[p].t === "d") { path = p; draw(); refreshFolderApps() }
                    else {
                        var appRoot = "/home/user/Apps/";
                        if (p.indexOf(appRoot) === 0) {
                            var appFolder = p.slice(0, p.indexOf("/", appRoot.length));
                            var def = folderAppDefinition(appFolder);
                            if (def) { registerHtmlApp(def); openApp(def.id) } else openApp("text", p);
                        } else openMyOSFile(p);
                    }
                });
                root.addEventListener("click", function (e) {
                    var b = e.target.closest("[data-a]"); if (!b) return;
                    var a = b.getAttribute("data-a");
                    if (a === "up") { path = dirOf(path); draw() }
                    if (a === "nf") ask(w, "New file", "index.html", function (n) { var p = join(path, n); if (!FS[p]) { FS[p] = { t: "f", c: "" }; saveFS() } refreshFolderApps(); draw() });
                    if (a === "nd") ask(w, "New folder", "New folder", function (n) { var p = join(path, n); if (!FS[p]) { FS[p] = { t: "d" }; saveFS() } refreshFolderApps(); draw() });
                    if (a === "import") { importInput.click() }
                    if (a === "upload") { uploadInput.click() }
                    if (a === "edit" && sel && FS[sel] && FS[sel].t === "f") { openApp("text", sel) }
                    if (a === "del" && sel) { rmTree(sel); refreshFolderApps(); draw() }
                });
                draw();
                return { load: function (p) { if (p && FS[p] && FS[p].t === "d") { path = p; draw() } } };
            }

            /* ---------------- Text editor ---------------- */
            function openText(w, arg) {
                var root = w.body, cur = null, dirty = false;
                root.className = "wc tx";
                root.innerHTML = '<div class="fm-bar"><span class="fm-path" id="tp">Untitled</span><button class="sbtn" data-a="s">Save</button></div><textarea spellcheck="false"></textarea>';
                var ta = $("textarea", root), tp = $(".fm-path", root);
                function title() { tp.textContent = (cur ? cur : "Untitled") + (dirty ? " •" : ""); w.setTitle((cur ? base(cur) : "Text") + (dirty ? " •" : "")) }
                function loadFile(p) {
                    if (p && FS[p] && FS[p].t === "f") { cur = p; ta.value = FS[p].c || ""; dirty = false; title() }
                }
                function doSave() {
                    if (cur) { FS[cur].c = ta.value; saveFS(); dirty = false; title() }
                    else ask(w, "Save as", "note.txt", function (n) { var p = join("/home/user/Documents", n); FS[p] = { t: "f", c: ta.value }; saveFS(); cur = p; dirty = false; title() });
                }
                ta.addEventListener("input", function () { dirty = true; title() });
                ta.addEventListener("keydown", function (e) {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); doSave() }
                    if (e.key === "Tab") { e.preventDefault(); var s = ta.selectionStart; ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 2; dirty = true; title() }
                });
                root.addEventListener("click", function (e) { if (e.target.closest('[data-a="s"]')) doSave() });
                loadFile(arg); title();
                return { load: loadFile };
            }

            /* ---------------- Terminal ---------------- */
            function openTerm(w) {
                var root = w.body, cwd = "/home/user", hist = [], hi = 0;
                root.className = "wc tm";
                root.innerHTML = '<div class="out"></div><div class="in"><span class="pr"></span><input spellcheck="false" autocomplete="off"></div>';
                var out = $(".out", root), inp = $("input", root), pr = $(".pr", root);
                function prompt_() { pr.textContent = "user@MyOS:" + (cwd === "/home/user" ? "~" : cwd) + "$" }
                function print(t) { var d = document.createElement("div"); d.className = "ln"; d.textContent = t; out.appendChild(d) }
                print("MyOS terminal. Type 'help' for a list of commands.");
                prompt_();
                var cmds = {
                    help: function () { print("help  ls  cd  pwd  cat  echo  mkdir  touch  rm  clear  date  whoami  neofetch  open <app>  debug") },
                    debug: function () {
                        print("========== MyOS DEBUG ==========");
                        print("Viewport: " + innerWidth + " x " + innerHeight);
                        print("Device pixel ratio: " + devicePixelRatio);
                        print("Apps registered: " + APPS.length);
                        print("Virtual files: " + Object.keys(FS).length);
                        print("Storage estimate: " + bytes(JSON.stringify(FS).length));
                        print("Online: " + navigator.onLine);
                        print("FPS: " + (window.__myosFPS || "Measuring..."));
                        print("JS heap: " + (performance.memory ? bytes(performance.memory.usedJSHeapSize) : "Not exposed by this browser"));
                        print("================================");
                    },
                    pwd: function () { print(cwd) },
                    whoami: function () { print("user") },
                    date: function () { print(new Date().toString()) },
                    clear: function () { out.innerHTML = "" },
                    echo: function (a) { print(a.join(" ")) },
                    ls: function (a) {
                        var p = resolve(cwd, a[0]); if (!FS[p]) return print("ls: " + (a[0] || p) + ": No such file or directory"); if (FS[p].t === "f") return print(base(p));
                        print(kids(p).map(function (k) { return base(k) + (FS[k].t === "d" ? "/" : "") }).join("  "))
                    },
                    cd: function (a) { var p = resolve(cwd, a[0] || "~"); if (!FS[p] || FS[p].t !== "d") return print("cd: " + (a[0] || p) + ": Not a directory"); cwd = p; prompt_() },
                    cat: function (a) { var p = resolve(cwd, a[0]); if (!FS[p] || FS[p].t !== "f") return print("cat: " + (a[0] || "") + ": No such file"); print(FS[p].c || "") },
                    mkdir: function (a) { if (!a[0]) return print("mkdir: missing operand"); var p = resolve(cwd, a[0]); if (FS[p]) return print("mkdir: " + a[0] + ": File exists"); if (!FS[dirOf(p)]) return print("mkdir: parent does not exist"); FS[p] = { t: "d" }; saveFS() },
                    touch: function (a) { if (!a[0]) return print("touch: missing operand"); var p = resolve(cwd, a[0]); if (!FS[p]) { if (!FS[dirOf(p)]) return print("touch: parent does not exist"); FS[p] = { t: "f", c: "" }; saveFS() } },
                    rm: function (a) { var p = resolve(cwd, a[0]); if (!FS[p] || p === "/") return print("rm: cannot remove '" + (a[0] || "") + "'"); rmTree(p) },
                    open: function (a) { var n = (a[0] || "").toLowerCase(); var m = APPS.filter(function (x) { return x.id === n || x.name.toLowerCase() === n })[0]; if (!m) return print("open: unknown app '" + (a[0] || "") + "'"); openApp(m.id) },
                    neofetch: function () {
                        print("user@MyOS\n----------\nOS:       MyOS (browser)\nShell:    MyOS-sh\nWM:       MyOS Shelf\nBrowser:  " + (navigator.userAgent.match(/(Firefox|Edg|Chrome|Safari)\/[\d.]+/) || ["unknown"])[0] +
                            "\nScreen:   " + innerWidth + "x" + innerHeight + "\nApps:     " + APPS.length)
                    }
                };
                inp.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") {
                        var line = inp.value; inp.value = "";
                        print(pr.textContent + " " + line);
                        var parts = line.trim().split(/\s+/).filter(Boolean);
                        if (parts.length) { hist.push(line); hi = hist.length; var c = cmds[parts[0]]; if (c) c(parts.slice(1)); else print(parts[0] + ": command not found") }
                        root.scrollTop = root.scrollHeight;
                    } else if (e.key === "ArrowUp") { e.preventDefault(); if (hi > 0) { hi--; inp.value = hist[hi] } }
                    else if (e.key === "ArrowDown") { e.preventDefault(); if (hi < hist.length - 1) { hi++; inp.value = hist[hi] } else { hi = hist.length; inp.value = "" } }
                    else if (e.key.toLowerCase() === "l" && e.ctrlKey) { e.preventDefault(); out.innerHTML = "" }
                });
                root.addEventListener("click", function (e) { if (!window.getSelection().toString()) inp.focus() });
                setTimeout(function () { inp.focus() }, 50);
                return {};
            }

            /* ---------------- Settings ---------------- */
            function openSettings(w) {
                var root = w.body, sec = "app";
                root.className = "wc st";
                function draw() {
                    var main = "";
                    if (sec === "app") {
                        main = '<h3>Appearance</h3><h5>Theme</h5><div class="seg"><button data-t="light" class="' + (cfg.theme === "light" ? "on" : "") + '">Light</button><button data-t="dark" class="' + (cfg.theme === "dark" ? "on" : "") + '">Dark</button></div>' +
                            '<h5>Wallpaper</h5><div class="walls">' + Object.keys(WALLS).map(function (k) { return '<button data-w="' + k + '" class="' + (cfg.wall === k ? "on" : "") + '" style="background-image:' + WALLS[k].replace(/"/g, "&quot;") + '" title="' + k + '"></button>' }).join("") + '</div>' +
                            '<h5>Custom cursor</h5><div class="seg cursor-options">' +
                            [["default", "Default"], ["pointer", "Pointer"], ["crosshair", "Crosshair"], ["grab", "Grab"], ["help", "Help"], ["text", "Text"], ["cell", "Cell"], ["wait", "Wait"], ["notAllowed", "Not allowed"], ["pencil", "Pencil"], ["neon", "Neon"]].map(function (c) { return '<button data-cursor="' + c[0] + '" class="' + ((cfg.cursor || "default") === c[0] ? "on" : "") + '">' + c[1] + '</button>' }).join("") +
                            '</div><p class="hint">Choose a cursor style. Your selection is saved on this device.</p>';
                    } else if (sec === "apps") {
                        main = '<h3>Apps</h3>' + APPS.map(function (a) {
                            return '<div class="arow">' + icHtml(a) + '<span class="an">' + esc(a.name) + (a.custom ? '<small>Web app</small>' : '') + '</span>' +
                                '<label class="sw"><input type="checkbox" data-pin="' + esc(a.id) + '"' + (isPinned(a) ? " checked" : "") + '> Pin to shelf</label>' +
                                (a.custom ? '<button class="btn" data-rm="' + esc(a.id) + '">Uninstall</button>' : '') + '</div>';
                        }).join("") +
                            '<h5>Add a web app</h5><div class="addrow"><input id="wa-n" placeholder="Name" autocomplete="off"><input id="wa-u" placeholder="https://example.com" autocomplete="off"><button class="btn fill" data-add="1">Add</button></div>' +
                            '<p class="hint">Use the App Store to install apps or create multi-file HTML apps. Some sites refuse to be shown inside another page and will appear blank. Use "Open in new tab" in the app window for those. To build an app with code, find <b>ADD YOUR APPS HERE</b> in this file.</p>';
                    } else if (sec === "wisp") {
                        var wisp = load("an_wisp_url", "wss://anura.pro");
                        var presets = ["wss://anura.pro", "wss://wisp.mercurywork.shop/", "wss://truffled.lol", "wss://daydreamx.pro", "wss://gointospace.app"];
                        var isPreset = presets.indexOf(wisp) >= 0;
                        main = '<h3>WISP Proxy</h3><p class="hint">Choose a WISP WebSocket server or enter your own endpoint. MyBrowser and MyMusic use this shared WISP server through Scramjet when MyOS is hosted on GitHub Pages.</p><label style="display:block;margin:12px 0 6px">Server</label><select id="wisp-preset" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--win);color:var(--text)">' + presets.map(function (u) { return '<option value="' + u + '" ' + (wisp === u ? 'selected' : '') + '>' + u + '</option>'; }).join("") + '<option value="custom" ' + (!isPreset ? 'selected' : '') + '>Custom server…</option></select><input id="wisp-custom" placeholder="wss://your-wisp-server/" style="display:' + (!isPreset ? 'block' : 'none') + ';width:100%;box-sizing:border-box;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--win);color:var(--text)" value="' + (!isPreset ? esc(wisp) : '') + '"><button class="btn fill" data-wisp-save style="margin-top:12px">Save WISP Server</button><p class="hint">Note: WISP servers use WebSocket (wss://). Scramjet routes browser frames through this server. The Scramjet runtime and service worker are deployed alongside MyOS by the included GitHub Actions workflow.</p>';
                    } else if (sec === "dev") {
                        main = '<h3>Device</h3><div class="kv"><span>Name</span><span>MyOS-web</span><span>Screen</span><span>' + innerWidth + ' × ' + innerHeight + '</span><span>Storage</span><span>' + bytes(JSON.stringify(FS).length) + ' used in browser</span><span>Language</span><span>' + esc(navigator.language) + '</span></div>' +
                            '<h5>Reset</h5><button class="btn fill" data-r="1">Erase files and settings</button>';
                    } else {
                        main = '<h3>About</h3><div class="kv"><span>Version</span><span>MyOS OS Template 1.0</span><span>Apps</span><span>' + APPS.map(function (a) { return a.name }).join(", ") + '</span><span>Storage</span><span>Browser localStorage</span></div>' +
                            '<p style="margin-top:20px;color:var(--sub);font-size:13px;line-height:1.5">MyOS is a customizable browser-based OS template. Use it as a starting point to build and brand your own web desktop.</p>';
                    }
                    root.innerHTML = '<div class="st-nav">' + [["app", "Appearance"], ["apps", "Apps"], ["wisp", "WISP"], ["dev", "Device"], ["about", "About"]].map(function (s) { return '<button data-s="' + s[0] + '" class="' + (sec === s[0] ? "on" : "") + '">' + s[1] + '</button>' }).join("") + '</div><div class="st-main">' + main + '</div>';
                }
                root.addEventListener("click", function (e) {
                    var t;
                    if ((t = e.target.closest("[data-s]"))) { sec = t.getAttribute("data-s"); draw() }
                    else if ((t = e.target.closest("[data-t]"))) { cfg.theme = t.getAttribute("data-t"); applyCfg(); draw() }
                    else if ((t = e.target.closest("[data-w]"))) { cfg.wall = t.getAttribute("data-w"); applyCfg(); draw() }
                    else if ((t = e.target.closest("[data-cursor]"))) { cfg.cursor = t.getAttribute("data-cursor"); applyCfg(); draw() }
                    else if (e.target.closest("[data-wisp-save]")) {
                        var choice = $("#wisp-preset", root).value;
                        var wu = choice === "custom" ? $("#wisp-custom", root).value.trim() : choice;
                        if (!/^wss:\/\//i.test(wu)) toast("Enter a valid WISP WebSocket address beginning with wss://");
                        else { save("an_wisp_url", wu); toast("WISP server saved"); draw(); }
                    }
                    else if (e.target.closest("[data-add]")) {
                        var def = addWebApp($("#wa-n", root).value, $("#wa-u", root).value);
                        if (def) { toast(def.name + " added to the shelf"); draw() } else toast("Enter a name and a valid web address");
                    }
                    else if ((t = e.target.closest("[data-rm]"))) { var rid = t.getAttribute("data-rm"); if (rid.indexOf("html-") === 0 || htmlApps.some(function (x) { return x.id === rid })) uninstallHtmlApp(rid); else removeWebApp(rid); draw(); toast("App uninstalled") }
                    else if (e.target.closest("[data-r]")) { try { localStorage.clear() } catch (x) { } location.reload() }
                });
                root.addEventListener("change", function (e) {
                    if (e.target && e.target.id === "wisp-preset") { var custom = $("#wisp-custom", root); if (custom) custom.style.display = e.target.value === "custom" ? "block" : "none"; }
                    var t = e.target.closest("[data-pin]"); if (t) setPinned(t.getAttribute("data-pin"), t.checked);
                });
                draw();
                return {};
            }

            /* MyOS FPS monitor */
            (function () {
                var last = performance.now(), frames = 0;
                function tick(now) { frames++; if (now - last >= 1000) { window.__myosFPS = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; } requestAnimationFrame(tick); }
                requestAnimationFrame(tick);
            })();

            /* ---------------- Boot ---------------- */
            bootDebug("Applying settings...");
            cfg = cfg || load("an_cfg", {
                theme: "light",
                wall: "dunes",
                cursor: "default"
            }) || {
                theme: "light",
                wall: "dunes",
                cursor: "default"
            };

            applyCfg();

            bootDebug("Preparing desktop...");
            booted = true;

            bootDebug("Rendering shelf...");
            renderShelf();

            bootDebug("Building launcher...");
            buildLauncher();

            bootDebug("Opening desktop...");
            setTimeout(function () {
                $("#boot").classList.add("gone");
                setTimeout(function () {
                    $("#boot").remove();
                }, 700);

                openApp("news");
            }, 1800);
        })();
    </script>
</body>
</html>
